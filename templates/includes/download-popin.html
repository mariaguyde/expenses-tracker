<div class="overlay">
    <div id="downloadForm">
        <form action="/download" method="get">
            <div class="close-btn"> x </div>

            <div class="content">
                <p>I want the records</p>
                <div>
                    <label>From </label>
                    <input type="date" name="date-start" required />
                </div>
                <div>
                    <label>To </label>
                    <input type="date" name="date-end" required />
                </div>
            </div>
            <button type="submit">Download the report</button>
        </form>
    </div>
    
</div>
