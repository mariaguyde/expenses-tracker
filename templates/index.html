<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="../static/style.css" rel="stylesheet"/>
        <title>Expense Tracker</title>
    </head>
    <body>
        <div id="header">
            <p>Expense Tracker</p>
        </div>
        <div id="content">
            <form id="expenseForm" action="/add" method="post">
                <p><span class="icon-plus">+</span>Add an expense</p>
                <div class="inputs">
                    <input type="name" name="expense" placeholder="Expense" required/>
                    <input type="number" name="amount" placeholder="Amount" required/>
                    <select name="category" required>
                        <option value="">Select a category</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}">{{ cat.name }}</option>
                        {% endfor %}
                    </select>
                    <input type="date" name="date" placeholder="Date" required />
                    <textarea id="notes" name="notes" rows="1" cols="7" placeholder="Notes"></textarea>
                    <button type="submit">Add</button>
                </div>
            </form>

            <div id="expenses-list">
                <div class="title">
                    <p>Your expenses</p>
                    <a href="{{ url_for('download') }}" class="">
                        <img class="icon-download" src="../static/assets/imgs/download.svg" alt="download" />
                        <span> Download the report</span>
                    </a>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Expense</th>
                            <th>Amount</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Notes</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if expenses|length %}
                            {% for exp in expenses %}
                                <tr>
                                    <td>{{exp.expense}}</td>
                                    <td>{{exp.amount}}</td>
                                    <td>{{exp.category}}</td>
                                    <td>{{exp.date}}</td>
                                    <td>{{exp.notes}}</td>
                                    <td>
                                        <img class="icon-trash delete-btn" id="{{exp.id}}" src="../static/assets/imgs/trash.svg" alt="delete" />
                                    </td>
                                </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td class="empty-list-msg">No records yet</td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </body>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</html>
