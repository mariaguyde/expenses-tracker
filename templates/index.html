<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home</title>
    </head>
    <body>
        <h1>Basic Expense Tracker</h1>
        <div>
            <p>Add an expense</p>
            <form id="expenseForm" action="/add" method="post" required>
                <input type="name" name="expense" placeholder="Expense" required/>
                <input type="number" name="amount" placeholder="Amount" required/>
                <input type="date" name="date" placeholder="Date" required />
                <select name="category" required>
                    <option value="">Select a category</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}">{{ cat.name }}</option>
                    {% endfor %}
                </select>
                <button type="submit">Add</button>
            </form>

            <div>
                <a href="{{ url_for('download') }}" class="">Download the report</a>
                <table>
                    <thead>
                        <tr>
                            <th>Expense</th>
                            <th>Amount</th>
                            <th>Date</th>
                            <th>Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for exp in expenses %}
                            <tr>
                                <td>{{exp.expense}}</td>
                                <td>{{exp.amount}}</td>
                                <td>{{exp.date}}</td>
                                <td>{{exp.category}}</td>
                                <td>
                                    <button class="delete-btn" id="{{exp.id}}">Delete</button>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>
    </body>
</html>
